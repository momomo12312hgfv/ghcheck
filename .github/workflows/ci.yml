name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - name: Build Action bundle
        if: runner.os == 'Linux'
        run: bun run build:action
      - name: Check Action bundle is up to date
        if: runner.os == 'Linux'
        run: git diff --exit-code action-dist/index.cjs
      - name: Check rule catalog is up to date
        if: runner.os == 'Linux'
        run: bun run docs && git diff --exit-code docs/rules.md
