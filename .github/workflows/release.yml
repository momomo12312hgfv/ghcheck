name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build:action
      - run: git diff --exit-code action-dist/index.cjs
      - run: bun run docs && git diff --exit-code docs/rules.md

  build:
    name: ${{ matrix.asset }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            asset: ghcheck-linux-x64
          - os: ubuntu-latest
            target: bun-linux-arm64
            asset: ghcheck-linux-arm64
          - os: macos-latest
            target: bun-darwin-x64
            asset: ghcheck-darwin-x64
          - os: macos-latest
            target: bun-darwin-arm64
            asset: ghcheck-darwin-arm64
          - os: windows-latest
            target: bun-windows-x64
            asset: ghcheck-windows-x64.exe

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Build
        shell: bash
        run: bun build --compile --minify --target=${{ matrix.target }} ./src/cli.ts --outfile dist/${{ matrix.asset }} # ghcheck: ignore workflow.indirect-interpolation
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  npm:
    name: Build the npm package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run build:mcp
      - run: mkdir -p dist
      - run: npm pack --pack-destination ../dist
        working-directory: npm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: npm-package
          path: dist/*.tgz
          if-no-files-found: error

  release:
    name: Publish release
    needs: [build, npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write # ghcheck: ignore token.write-permission-contents
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            dist/*
          generate_release_notes: true
